# Program-version registry — AUTHORITATIVE labels for tabbed program pages.
#
# Every chunk from a listed panel (and from panels nested inside it, unless
# they have their own entry) gets this version: label, accreditation year,
# status and modules.  This is what keeps "2 modules" (2026) and "3 modules"
# (2019) apart.
#
# Fields
#   page               canonical page URL
#   program / level    level: osnovne | master | doktorske
#   version_label      shown in every chunk header and in the version map
#   accreditation_year as stated on the site (null if unknown)
#   enrollment_from    first enrollment year (2026 = "upis 2026/27")
#   enrollment_to      last enrollment year; leave empty → inferred from the
#                      next version's enrollment_from - 1
#   status             optional override: enrolling | phase_out | upcoming | legacy
#                      (otherwise computed from the years and today's date)
#   modules            module names exactly as on the page (checked against it)
#   panels             tab panel ids on that page (see report.md → section ids)
#
# DeepSeek proposes entries for unmapped panels in programs.draft.yaml —
# review them and move them here.
#
# Pre-filled 2026-10-10 from the live HTML. Entries marked TODO need a human
# check (years not stated explicitly on the page).

